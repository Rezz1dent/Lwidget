name: Breezy Weather test APK

on:
  push:
    branches:
      - fix/breezy-weather
      - feature/weather-fields
      - feature/weather-three-lines
      - feature/weather-theme-scaling
      - feature/breezy-to-kwgt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: lwidget-breezy-to-kwgt-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
