name: Breezy to KWGT mini bridge
on:
  push:
    branches: [feature/kwgt-responsive, feature/kwgt-bridge-hidden-weather, feature/kwgt-three-row-v7, feature/kwgt-meteo-v10, feature/breezy-content-provider-bridge]
    paths:
      - bridge/**
      - settings.gradle.kts
      - .github/workflows/breezy-kwgt-mini-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build lightweight standalone bridge
        run: bash ./gradlew :bridge:assembleDebug --no-daemon
      - name: Check independent bridge package, no launcher icon, provider access and settings
        run: |
          APK=bridge/build/outputs/apk/debug/bridge-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)
          "$AAPT" dump badging "$APK" > /tmp/bridge-badging.txt
          if grep -q 'launchable-activity:' /tmp/bridge-badging.txt; then
            echo "FAIL: bridge has a launcher icon"
            exit 1
          fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/bridge-manifest.txt
          grep -q 'android.intent.action.APPLICATION_PREFERENCES' /tmp/bridge-manifest.txt
          grep -q 'org.breezyweather.ACTION_UPDATE_NOTIFIER' /tmp/bridge-manifest.txt
          grep -q 'org.breezyweather.READ_PROVIDER' /tmp/bridge-manifest.txt
          grep -q 'com.rezz1dent.breezykwgtbridge' /tmp/bridge-badging.txt
          echo "Verified: independent bridge, no launcher activity, provider and settings."
      - uses: actions/upload-artifact@v4
        with:
          name: breezy-kwgt-provider-preview-v1
          path: bridge/build/outputs/apk/debug/*.apk
          if-no-files-found: error
